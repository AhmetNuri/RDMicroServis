worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time x-correlation-id=$http_x_correlation_id';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream backends
    upstream auth_service {
        server auth-service:8080;
        keepalive 32;
    }

    upstream order_service {
        server order-service:8080;
        keepalive 32;
    }

    upstream notification_service {
        server notification-service:8080;
        keepalive 32;
    }

    upstream audit_service {
        server audit-service:8080;
        keepalive 32;
    }

    upstream analytics_service {
        server analytics-service:8080;
        keepalive 32;
    }

    upstream search_indexer_service {
        server search-indexer-service:8080;
        keepalive 32;
    }

    upstream product_service {
        server product-service:8080;
        keepalive 32;
    }

    upstream payment_service {
        server payment-service:8080;
        keepalive 32;
    }

    upstream inventory_service {
        server inventory-service:8080;
        keepalive 32;
    }

    # Upstream frontends
    upstream shop_web {
        server shop-web:3000;
        keepalive 16;
    }

    upstream landing_web {
        server landing-web:3000;
        keepalive 16;
    }

    upstream admin_portal {
        server admin-portal:80;
        keepalive 16;
    }

    upstream operations_panel {
        server operations-panel:80;
        keepalive 16;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_rate:10m rate=20r/m;

    server {
        listen 8080;
        server_name _;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Correlation-ID" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ─── API Routes ────────────────────────────────────────────────

        location /api/auth/ {
            limit_req zone=auth_rate burst=10 nodelay;
            proxy_pass http://auth_service/;
        }

        location /api/orders/ {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_pass http://order_service/;
        }

        location /api/notifications/ {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_pass http://notification_service/;
        }

        location /api/audit/ {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_pass http://audit_service/;
        }

        location /api/analytics/ {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_pass http://analytics_service/;
        }

        location /api/search/ {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_pass http://search_indexer_service/;
        }

        location /api/products/ {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_pass http://product_service/api/products/;
        }

        location /api/payments/ {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_pass http://payment_service/api/payments/;
        }

        location /api/inventory/ {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_pass http://inventory_service/api/inventory/;
        }

        # WebSocket support for notification service
        location /ws/ {
            proxy_pass http://notification_service/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # ─── Frontend Routes ───────────────────────────────────────────

        # Admin Portal (Angular) - /admin
        location /admin {
            proxy_pass http://admin_portal;
        }

        # Operations Panel (Angular) - /ops
        location /ops {
            proxy_pass http://operations_panel;
        }

        # Landing page - /landing
        location /landing {
            proxy_pass http://landing_web;
        }

        # Shop Web (Next.js) - default route
        location / {
            proxy_pass http://shop_web;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
